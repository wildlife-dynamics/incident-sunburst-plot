[workspace]
name = "incident-sunburst-plot"
channels = [
  'https://repo.prefix.dev/ecoscope-workflows/',
  'conda-forge',
]
platforms = ['linux-64', 'osx-arm64', 'osx-64', 'win-64']

[dependencies]
wt-compiler = "==0.10.2"
python = "3.14.*"
graphviz = "*"
go-yq = "*"  # used by dev/run-test-cases.sh
# wt-compiler's VERSION.yaml dump breaks on ruamel.yaml 0.17 (picked when python reaches 3.15).
"ruamel.yaml" = ">=0.18,<0.19"

[tasks.compile-incident-sunburst-plot]
cmd = './dev/recompile.sh --install'

[tasks.recompile-incident-sunburst-plot]
cmd = './dev/recompile.sh --update'
