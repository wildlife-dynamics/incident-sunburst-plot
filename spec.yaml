id: incident_sunburst_plot

metadata:
  name: Incident Sunburst Plot
  description: >-
    Shows EarthRanger incidents as a sunburst: incidents in the inner ring, their event types
    in the outer ring, each slice sized by its number of events. All of an incident's events
    are included, even those dated outside the time range.
  maintainers:
    - name: Zakariya Husayn
      email: zakariya@wildlifedynamics.com
      role: owner
    - name: Yun Wu
      email: yun@wildlifedynamics.com
      role: reviewer
  outputs:
    - name: Incident Sunburst
      type: plot
      description: >-
        Inner ring: incidents. Outer ring: each incident's event types, in the incident's
        colour. Slice size is the number of events. Click a slice to zoom in.
      indicators:
        - name: Incidents
  license: BSD-3-Clause
  repository: https://github.com/wildlife-dynamics/incident-sunburst-plot
  documentation: https://github.com/wildlife-dynamics/incident-sunburst-plot#readme
  readme: README.md
  keywords: [incidents, events, sunburst, earthranger]
  thumbnail: resources/thumbnail.png

requirements:
  # draw_sunburst_chart's expand_other arrived in 2.37.0; color_ring and leaf_opacity in 2.38.0.
  - name: ecoscope-platform
    version: ">=2.38.0,<3.0.0"
    channel: https://repo.prefix.dev/ecoscope-workflows/

  # ecoscope-platform requires pydeck==0.9.2, which is only on conda-forge;
  # pinned explicitly so strict channel priority can resolve it.
  - name: pydeck
    version: 0.9.2
    channel: conda-forge

rjsf-overrides:
  properties:
    time_range.description: >-
      Choose the period. Incidents created in this period are included, with all
      of their events.

    groupers.properties.groupers.description: >-
      Choose Incident for one view per incident (optional). Leave empty for one
      view of all incidents.
    groupers.properties.groupers.items.anyOf:
      - "$ref": "#/$defs/ValueGrouper"

    Sunburst.properties.sunburst.properties.top_n.title: Show only the biggest incidents
    Sunburst.properties.sunburst.properties.top_n.description: >-
      Leave empty to show every incident. Enter a number, for example 10, to keep the 10
      incidents with the most events and join the rest into one grey "Other" slice; click it
      to see them. Inside each incident, event types beyond its 10 most common are also
      joined into "Other".

  $defs:
    ValueGrouper.properties.index_name.oneOf:
      - const: incident
        title: Incident

  uiSchema:
    groupers.groupers.items.anyOf:
      - ui:options:
          label: false

task-instance-defaults:
  skipif:
    conditions:
      - any_is_empty_df
      - any_dependency_skipped

workflow:
  - name: Workflow Details
    id: workflow_details
    task: set_workflow_details

  - name: Data Source
    id: er_client
    task: set_er_connection

  - name: Time Range
    id: time_range
    task: set_time_range
    partial:
      time_format: "%d %b %Y %H:%M:%S %Z"

  - name: Group by
    id: groupers
    task: set_groupers

  - title: Incidents
    type: task-group
    description: Download the incidents and all of their events.
    tasks:
      - id: incident_events
        task: get_incident_events
        partial:
          client: ${{ workflow.er_client.return }}
          time_range: ${{ workflow.time_range.return }}
          # Not in the form: no site has incidents inside incidents yet. Nested
          # incidents are still followed up to 5 levels deep.
          max_depth: 5
          include_icons: false

      # Colours are assigned once, before splitting, so an event type keeps its
      # colour in every view. The most common type gets the first colour (ties by
      # name). Same task and list as incident-storyboard, so on the same site and
      # time range an event type has the same colour in both.
      - id: event_type_colors
        task: color_map_by_frequency
        partial:
          df: ${{ workflow.incident_events.return }}
          input_column_name: event_type_display
          colormap:
            - "#2a78d6"
            - "#eb6834"
            - "#1baf7a"
            - "#eda100"
            - "#e87ba4"
            - "#008300"
            - "#6250d6"
            - "#e34948"
            - "#0f9fb5"
            - "#8c5a3c"
            - "#a6b51b"
            - "#b14fc5"
            - "#1f4e8c"
            - "#7cc4f0"
            - "#9b2f5f"
            - "#d4a3e8"

      - id: incident_data
        task: apply_color_map
        partial:
          df: ${{ workflow.incident_events.return }}
          input_column_name: event_type_display
          output_column_name: event_type_color
          colormap: ${{ workflow.event_type_colors.return }}

      - id: incidents_split
        task: split_groups
        partial:
          df: ${{ workflow.incident_data.return }}
          groupers: ${{ workflow.groupers.return }}

  - title: Sunburst
    type: task-group
    description: ""
    tasks:
      - id: sunburst
        task: draw_sunburst_chart
        # only top_n is left in the form. Event types take their event-type colour (as in
        # incident-storyboard); incidents are one light grey.
        partial:
          ring_columns: [incident, event_type_display]
          value_column: null
          color_column: event_type_color
          color_ring: 1
          palette: ["#e6e9ee"]
          pinned_values: null
          other_color: null
          # "Other" keeps its incidents by name: click it to see them and their event types.
          expand_other: true
          # names run along each slice, so they stay centred in a wide ring once "Other" is open
          # leaf_opacity 1: event types at full colour, matching the storyboard tiles
          plot_style:
            insidetextorientation: radial
            leaf_opacity: 1
          layout_style: null
        mapvalues:
          argnames: dataframe
          argvalues: ${{ workflow.incidents_split.return }}

      - id: sunburst_html
        task: persist_text
        partial:
          root_path: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
          filename_suffix: incident_sunburst
        mapvalues:
          argnames: text
          argvalues: ${{ workflow.sunburst.return }}

      - id: sunburst_widget
        task: create_plot_widget_single_view
        skipif:
          conditions:
            - never
        partial:
          title: Events by incident and event type
        map:
          argnames: [view, data]
          argvalues: ${{ workflow.sunburst_html.return }}

      - id: sunburst_merged
        task: merge_widget_views
        skipif:
          conditions:
            - never
        partial:
          widgets: ${{ workflow.sunburst_widget.return }}

  - name: Dashboard
    id: dashboard
    task: gather_dashboard
    partial:
      details: ${{ workflow.workflow_details.return }}
      widgets:
        - ${{ workflow.sunburst_merged.return }}
      groupers: ${{ workflow.groupers.return }}
      time_range: ${{ workflow.time_range.return }}
